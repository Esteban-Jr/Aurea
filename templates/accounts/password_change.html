{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Change password" %} | Aurea{% endblock %}

{% block content %}
<div class="container">
  {% include "includes/page_header.html" with eyebrow=_("My account") title=_("Change Password") %}
  <div class="panel panel-narrow">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-grid mt-2">
        <button type="submit" class="btn btn-dark">{% translate "Update password" %}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
